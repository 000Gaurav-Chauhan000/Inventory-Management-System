services:
  # Api Gateway (Publicly accessible)
  - type: web
    name: api-gateway
    env: docker
    dockerContext: StockPro
    dockerfilePath: ApiGateway/Dockerfile
    plan: free # Change to a higher plan if needed
    envVars:
      - key: RENDER
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080

  # Auth Service (Internal only)
  - type: pserv
    name: auth-service
    env: docker
    dockerContext: StockPro
    dockerfilePath: AuthService/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false # User should set this in Render UI
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: StockPro
      - key: Jwt__Audience
        value: StockProUsers
      - key: ASPNETCORE_URLS
        value: http://+:8080

  # Product Service (Internal only)
  - type: pserv
    name: product-service
    env: docker
    dockerContext: StockPro
    dockerfilePath: ProductService/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ASPNETCORE_URLS
        value: http://+:8080

  # Warehouse Service (Internal only)
